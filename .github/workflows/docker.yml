name: Docker image

# Builds the frontend image on every push to main and publishes it as
# ghcr.io/<owner>/piped-frontend:latest.

on:
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/piped-frontend:latest
                  labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
