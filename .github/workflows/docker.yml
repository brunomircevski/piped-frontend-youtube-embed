name: Docker image

# Builds the frontend image on every push to main and publishes it as
# ghcr.io/<owner>/piped-frontend:latest.

on:
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  # A plain single image: attestations add separate "untagged" versions
                  # in GHCR, and deleting those breaks the tag.
                  provenance: false
                  sbom: false
                  tags: ghcr.io/${{ github.repository_owner }}/piped-frontend:latest
