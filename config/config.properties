# Piped backend config for the local HTTP-only test stack.
# Hostnames use the *.localhost TLD which browsers resolve to 127.0.0.1.

PORT: 8080
HTTP_WORKERS: 2

PROXY_PART: http://pipedproxy.localhost:8080

CAPTCHA_BASE_URL: https://api.capmonster.cloud/
CAPTCHA_API_KEY: INSERT_HERE

API_URL: http://pipedapi.localhost:8080
FRONTEND_URL: http://piped.localhost:8080

COMPROMISED_PASSWORD_CHECK: true
DISABLE_REGISTRATION: false
FEED_RETENTION: 30
DISABLE_TIMERS: false
RYD_PROXY_URL: https://ryd-proxy.kavin.rocks
DISABLE_RYD: false
DISABLE_SERVER: false
DISABLE_LBRY: false
SUBSCRIPTIONS_EXPIRY: 30
CONSENT_COOKIE: true
MATRIX_SERVER: https://matrix-client.matrix.org

# BG Helper URL for supplying PoTokens
BG_HELPER_URL: http://bg-helper:3000

# Hibernate / PostgreSQL
hibernate.connection.url: jdbc:postgresql://postgres:5432/piped
hibernate.connection.driver_class: org.postgresql.Driver
hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
hibernate.connection.username: piped
hibernate.connection.password: changeme
